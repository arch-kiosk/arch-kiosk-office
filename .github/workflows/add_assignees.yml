name: Add Assignees

on:
  issues:
    types: [opened]

jobs:
  add-assignees:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add assignees using GitHub CLI
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-assignee "urapadmin,${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
